# free.datiya.com 节点聚合配置
site:
  base_url: "https://free.datiya.com"
  rss: "/index.xml"          # 站点 RSS，用于发现每日文章日期
  lookback_days: 7           # 向前回溯几天的文章一起采集（跨天去重，节点更多）
  timeout: 20                # 单次请求超时（秒）
  retries: 3                 # 请求失败重试次数
  retry_backoff: 2.0         # 重试退避基数（秒）

# 附加订阅源（Clash 格式），与 datiya 节点合并去重后再统一测活。
# 只读取每个源里的 proxies 列表，源自身的规则/分组会被忽略。
sources:
  - name: ripaojiedian
    url: "https://raw.githubusercontent.com/ripaojiedian/freenode/main/clash"
  - name: ermaozi
    url: "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
  - name: NoMoreWalls
    url: "https://raw.githubusercontent.com/peasoft/NoMoreWalls/master/list.yml"
  - name: ShadowsocksAggregator
    url: "https://raw.githubusercontent.com/mahdibland/ShadowsocksAggregator/master/Eternity.yml"
  - name: passcro
    url: "https://raw.githubusercontent.com/zhangkaiitugithub/passcro/main/speednodes.yaml"

check:
  enabled: true              # 是否做测活
  method: "mihomo"           # mihomo=用内核真实测速（推荐）；tcp=仅测 TCP 端口连通
  min_alive: 1               # 可用节点少于该值时不覆盖已有订阅（防止把好订阅写坏）
  # --- method: mihomo ---
  binary: ""                 # mihomo 可执行文件路径，留空则用 PATH 中的 mihomo
  # 第一轮：连通性 + 延迟
  test_url: "http://www.gstatic.com/generate_204"
  timeout_ms: 3000           # 单节点连通测试超时（毫秒）
  concurrency: 50            # 并发数
  max_delay_ms: 2000         # 延迟上限，超过的剔除；0=不限
  # 第二轮：真实下载测速（剔除下载失败或网速过低的）
  speed_url: "https://speed.cloudflare.com/__down?bytes=2000000"
  speed_bytes: 1000000       # 下载够这么多字节就够算速度
  speed_timeout_ms: 5000     # 单节点测速预算（毫秒）
  speed_concurrency: 10      # 并发下载数（太高会互相抢带宽，反而测不准）
  min_speed_kbps: 100        # 网速下限（KB/s），低于的剔除
  # --- method: tcp（仅连通性，精度低）---
  tcp_timeout: 3.0           # 单个节点 TCP 连接超时（秒）
  tcp_concurrency: 200       # 并发数

output:
  dir: "docs"                # 产物目录（GitHub Pages 直接发布该目录）
  clash_file: "sub/clash.yaml"
  v2ray_file: "sub/v2ray.txt"
  status_file: "status.json"

clash:
  http_port: 7890
  socks_port: 7891
  external_controller: "127.0.0.1:9090"
  test_url: "http://www.gstatic.com/generate_204"
  test_interval: 300
# free.datiya.com 节点聚合配置
site:
  enabled: false             # 主源已停用：2026-10-22 实测 7 天共 98 个节点、全是
                             # vmess/ss，随机 14 个本机逐节点 CONNECT → 0 存活；
                             # 去重后独家节点 0 个（全部被附加源覆盖），对订阅零增量。
                             # 关掉后只跑下面 sources 里的附加源，改回 true 即恢复。
  base_url: "https://free.datiya.com"
  rss: "/index.xml"          # 站点 RSS，用于发现每日文章日期
  lookback_days: 7           # 向前回溯几天的文章一起采集（跨天去重，节点更多）
  timeout: 20                # 单次请求超时（秒）
  retries: 3                 # 请求失败重试次数
  retry_backoff: 2.0         # 重试退避基数（秒）

# 附加订阅源（Clash 格式），与 datiya 节点合并去重后再统一测活。
# 只读取每个源里的 proxies 列表，源自身的规则/分组会被忽略。
sources:
  - name: ermaozi
    url: "https://raw.githubusercontent.com/ermaozi/get_subscribe/main/subscribe/clash.yml"
  - name: TopFreeProxy
    url: "https://raw.githubusercontent.com/VPN-Subcription-Links/ClashX-V2Ray-TopFreeProxy/main/combine/clash.config.yaml"
  - name: daily_free_vpn
    url: "https://raw.githubusercontent.com/cbusifabcap/daily_free_vpn/main/sub/ClashMeta.yml"
  # Au1rxx/free-vpn-subscriptions：每小时更新，上游用 sing-box 对每个节点真实转发
  # HTTP 流量验证后发布（非仅 TCP 通），all-verified 为全量分片（curated 单文件按海外
  # 延迟排序、与国内可达目标错配，实测优质节点反被轮换掉，故不用）。
  #
  # 2026-10-22 按分片实测（每片随机 40 个，本机 mihomo 逐节点 CONNECT）：
  #   07 → 17.5%   06 → 10%   03/04/05 → 各 2.5%   01/02 → 0%   08/09/10 → HTTP 404
  # 分片是**全量切块**而不是按质量排序，所以低序号片并不是「最好的片」；这里只留实测
  # 最好的两片（06/07），其余不再浪费采集与候选名额。08~10 上游已裁掉，是死链。
  # 分片内容每小时轮换，这个排名会漂移；status.json 的 source_health 每轮自己产出
  # 各源命中率，届时按数据再调（别照抄本节数字）。
  - name: Au1rxx-06
    url: "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/all-verified/clash-0006.yaml"
  - name: Au1rxx-07
    url: "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/all-verified/clash-0007.yaml"
  # zhuhaiuk/free-nodes：只有 28 个节点，但 2026-10-22 实测本机连通率 32%（9/28），
  # 是横向比过的十几个公开源里最高的（ermaozi 18%、daily_free_vpn 11%、其余 0~1%）。
  # 与其他源重复 10 个、独家 18 个，属于「量小但打得很准」的源，所以只加它一个。
  #
  # 同轮实测被否掉的一批（抽样 70~120 个，本机 mihomo 逐节点 CONNECT）：
  #   Anaer/Sub 1611 个 → 1%      Eternity 201 个 → 0%      ts-sf 200 个 → 0%
  #   NoMoreWalls 131 个 → 1%     chengaopan 133 个 → 1%    free18 351 个 → 1%
  #   Barabama 23 个 → 0%         Au1rxx stable-01~05 各 70 个 → 0~3%
  # 节点多 ≠ 能用：这些源的节点要么早已失效，要么上游用境外视角挑的「活」，国内一律连不上。
  - name: zhuhaiuk
    url: "https://raw.githubusercontent.com/zhuhaiuk/free-nodes/main/clash_config.yaml"
  # LeilaoMi/AutoMergePublicNodes-Optimized：**2026-10-27 全量实测，唯一值得新增的源**。
  # 129 个节点，本机 mihomo 逐节点真实 CONNECT 通过 73 个（56.6%，横向比过的所有源里最高），
  # 测出网速 55 个，≥100KB/s 28 个；与现有 6 源重叠 71 个、独家 58 个
  # （独家且 ≥100KB/s 的 10 个，最快 1194KB/s）。
  #
  # **别指望它大幅增加发布量**：2026-10-27 16:26 做过同白名单对照构建（唯一变量是加不加它），
  # 含它是 31 个、不含它是 29 个 —— 每轮净贡献 1~2 个。原因有三层，每一层都在打折：
  #   ① 它 55% 的节点与现有源重复（它就是聚合源，只是聚合范围更宽）；
  #   ② 独家节点里 ss/trojan 那 43 个**永远进不了候选池**（协议分把低分协议饿死，见下面
  #      rank_by_protocol 的说明），能进池的只有 64 个 http + 22 个 vless；
  #   ③ 进了池还要过「本轮测通 → 测出网速 → ≥100KB/s」三道闸。
  # 仍然留着它：它是唯一连通率 >50% 的源，且不占探测时间（129 个体量很小），
  # 属于「零成本、长期可能变好」的一票。真正把发布量从 16 拉到 31 的是 candidates.max。
  #
  # 只取 output/verified.yaml（上游已用真实转发验证过），不用 output/global.yaml：
  # 后者 300 个节点实测连通率 13.3%、每 30 样本仅 1 个达标，是未筛的全量。
  # 更新频率实测约每 6~8 小时一次（一天 3~4 次）。
  - name: LeilaoMi
    url: "https://raw.githubusercontent.com/LeilaoMi/AutoMergePublicNodes-Optimized/main/output/verified.yaml"
  # 同批实测被否掉的（每源抽样 30 个，同一内核同一端点）：
  #   mfuu/FreeProxies  独家 67 个但只 10 个连通、0 个达标（且 sub.yaml 的 IPv6
  #                     节点名里嵌了未转义引号，整份 YAML 解析失败，需容错解析）
  #   xyfqzy            全站 6 个节点，独家 1 个、0 个达标
  #   tonykongcn        全站 5 个节点
  #   freenodess        连通 0~3.3%
  #   lanzm/MetaFetch   连通 3.3%，0 个测出网速
  #   crossxx-labs/free-proxy（1841 star）  仓库里没有节点文件，只有引流页；
  #                     订阅每 4 小时过期、必须在网页上手动点开 → 无法自动化
  #   ninja / Surfboard / mheidari  是 base64 的 v2ray 链接，本项目解析器只吃 Clash 格式

# 源健康度：每轮构建自动产出「各源实测命中率」（发布 / 进入候选池），
# 写进 docs/status.json 的 source_health 段与本文件指向的滚动记录。
# 采集时节点会带上 _srcs 标记（贡献过该节点的源名，跨源重复的会有多个）。
source_health:
  enabled: true
  file: "source_health.json"   # 仓库根目录，跨构建滚动（EWMA），CI 会一起提交
  ewma_alpha: 0.5              # 新一轮权重：0.5 ≈ 最近 3~4 轮为主

check:
  enabled: true              # 是否做测活
  method: "mihomo"           # mihomo=用内核真实测速（推荐）；tcp=仅测 TCP 端口连通
  min_alive: 30              # 可用节点少于该值时不覆盖已有订阅（防止把好订阅写坏）
  min_speed_keep: 5          # 但若节点少是「网速下限主动筛掉」造成的（不是采集/探测
                             # 故障），则放宽到该值。否则严格过滤的轮次会被 min_alive
                             # 拦下、保留旧订阅，等于过滤从没生效过。
  # --- method: mihomo ---
  binary: ""                 # mihomo 可执行文件路径，留空则用 PATH 中的 mihomo
  # 第一轮：连通性 + 延迟
  test_url: "https://www.gstatic.com/generate_204"
  timeout_ms: 5000           # 单节点连通测试超时（毫秒）。本机探测也用它：
                             # 3 秒对晚高峰的国际链路偏严，会把「慢但能用」判死
  concurrency: 30            # 并发数。本机探测也用它：
                             # 50 并发会自己把自己堵住，制造假阴性
  # 分批探测（本机 local_probe 用）：一次性把上千个节点拨出去会把自己拨到假死。
  # 实测 2026-10-22：242 个订阅节点一次并发 30 只测出 107 个（44%），把判死的 135 个
  # 单独装一个小实例、并发 4 复测，又有 42 个活过来（合并 62%）——被压死的不是死节点。
  chunk: 150                 # 每批测多少个节点（0=不分批，回到老行为）
  chunk_gap: 1.5             # 批与批之间的间隔（秒），给上游/本机 NAT 喘口气
  retry_concurrency: 6       # 失败节点的低并发补测轮；0=关闭补测
                             # 实测每轮能救回 30% 左右的「假死」节点
  max_delay_ms: 1500         # 延迟上限，超过的剔除；0=不限
  max_per_line: 2            # 同一 server:port 最多保留几个凭据（0=不限）。
                             # 公开源里同一台机器常挂几十个 uuid，同时失效，留多份只是
                             # 重复占位、挤占探测额度；存活达标的节点自动放宽到 4 个。
  # 发布时的分区排序依据：按协议「真实出网可用率」把最能用的排在订阅头部
  # （客户端 url-test 与手工挑选通常只取前面几个，顺序直接决定体验）。
  # 下面的分数来自 2026-10-21 在本机（国内家宽）用 mihomo 内核逐节点 CONNECT 的实测，
  # 样本为当时线上全部 237 个节点；协议可用率变化时请重新标定。
  # 注意：http/socks5 是明文代理，只能看到你访问的域名（HTTPS 内容仍端到端加密），
  # 但来源不可控，敏感场景建议优先选 vless/vmess 等加密协议。
  # 实测（2026-10-21，本机 mihomo 逐节点真实 CONNECT，两批共 396 个节点样本）：
  #   http 84~90%   socks5 100%   vless 10~21%   ss/vmess/trojan/anytls/hysteria2 ≈ 0%
  # 打分只需相对大小，80 分以上被视为「高可用」，优先占用 Globalping 探测名额。
  protocol_score:
    socks5: 100
    http: 86
    vless: 15
    ss: 5
    vmess: 5
    trojan: 5
    anytls: 5
    hysteria2: 2
  # 高可用协议最多占「探测名额」的比例（按 max_units 算，不是按候选总数）。
  # 留一成给其他协议，避免订阅 100% 是单一协议：同源节点往往成批失效，
  # 全押 http 风险集中；这一成的实测可用率虽然低，但能保住协议多样性。
  # 实测代价：把它调到 1.0（全给 http）可用节点会多约 20 个，但订阅变成纯 http。
  high_score_quota: 0.9
  # 低分区每个协议保底的「探索名额」（见 builder._round_robin_head）。
  # 问题背景：上面的协议分是固定常数，低分区又按「协议分 × 源因子」排，
  # 所以只要 vless 的绝对数量够多（实测采集池 2634 条），其他协议就永远排在后面、
  # 永远挤不进候选名额。2026-10-27 实测改造前候选池 1000 个的构成是
  # vless 725 + http 266 + socks5 9，**vmess 1048 / trojan 705 / ss 158 / hy2 148
  # 一个都没有**——它们不是被「评估后淘汰」，而是**根本没被评估过**。
  #
  # 2026-10-27 按协议各抽 10 个（同一内核、同一端点、随机固定种子）实测达标率：
  #   hysteria2 20%（最快 7209KB/s）  trojan 10%（728KB/s）  http 20%
  #   vless 0/10   vmess 0/10   ss 0/10
  # 也就是说 hy2/trojan 的实际表现**好于**协议分最高的 vless，而它们的分是 2 和 5。
  # 又用「同样 12 个名额」做过对照：给低分协议 → 达标 2 个（662/513KB/s）；
  # 还给 vless → 达标 1 个（109KB/s）。所以探索名额不是保费，是净赚。
  #
  # 取 4 = 每协议各占 4 个（6 个低分协议共 24 个名额，挤掉等量 vless）。
  # 不再往上加的原因：vless 的 700+ 名额按 10~20% 命中仍是主要供给，而 hy2/trojan
  # 基数只有 148/705，样本再多也测不出更多；24 个已经能给每个协议一个可信的样本。
  # 设 0 恢复旧的纯协议分排序（等于让低分协议永久饿死）。
  protocol_explore_per_type: 4
  # 源信誉分（0~100，相对值）：同一协议里，不同源的节点命运不同。
  # 依据两轮实测：
  #   ① 2026-10-22 按源随机抽样（每源 40 个）：daily_free_vpn 38%（http 子集 78.6%）
  #      Au1rxx-07 17.5%  ermaozi 15%  Au1rxx-06 10%  TopFreeProxy 0/40  datiya 0/14；
  #   ② 同一天线上候选池的实测命中率（status.json → source_health）：TopFreeProxy 的
  #      **http 子集** 67/120 = 56%，并不差 —— 它那 2647 个节点绝大多数是 vless/vmess，
  #      把整体拉到 0%，所以「0/40」不能推断成「它的 http 也不行」。
  # 结论：源分只用来区分「同一协议内的先后」，不能用来整源判死。TopFreeProxy 从 20 上调到 60
  # 就是这个原因；datiya 主源保留 10（全是 vmess/ss，实测 0/14，且被协议分再压一遍）。
  # 用法是「分区内排序」而不是乘进分区判据：协议分决定进哪个区（不会因某个主力源临时 404
  # 就把别源的高可用节点一起打落），源分决定同区内谁先占探测名额。
  # 未列出的源按 50 算（中性），新源不必先登记。
  source_score:
    LeilaoMi: 95              # 2026-10-27 全量实测连通率 56.6%（73/129），历史最高，
                              # 高于 zhuhaiuk 的 43.3%、Au1rxx-07 的 23.3%
    zhuhaiuk: 90              # 连通率最高（32%），但只有 28 个节点
    Au1rxx-07: 80
    Au1rxx-06: 70
    daily_free_vpn: 100
    ermaozi: 60
    TopFreeProxy: 60
    datiya: 10                # 主源已停用（site.enabled=false），此分仅在恢复主源时有意义

  # --- 发布顺序：只按实测网速（快 → 慢）---
  # 见 builder.sort_by_speed：直接比原始 kbps，不做归一化/加权。单维排序里
  # 「log 压缩 + 封顶」是有害的——超过参考线的节点会全部挤成满分，1MB/s 和 160KB/s
  # 排不出先后，用户看到的顺序就不可信了。
  # 没测出网速的（本机实测约 4 成节点只能 CONNECT、下载超时）排在末尾，
  # 它们之间按存活轮次、再按原始顺序，只为顺序稳定可复现。
  # 只影响订阅里节点的排列顺序，不淘汰任何节点。
  rank:
    enabled: true
    # 「老黄牛」前置：存活够久**且**够快的节点整体排到最前（层内仍按网速降序）。
    # 为什么需要这一层：免费节点的通病是「快但短命」——刚测出 8MB/s、十分钟后就没了。
    # 只看网速，用户每次都得重新踩坑；补上存活维度后，「1.5MB/s 但已经稳了 5 天」
    # 会排在「8MB/s 但只活了 20 分钟」前面，这才是能长期用的那条。
    # 两个条件缺一不可：只按存活排会把几十 KB/s 的老僵尸顶上来（它们活得久恰恰因为
    # 没人用），只按网速排又会奖励刚上线马上要死的节点。
    # 任一项设为 0 即关闭该层，回到「只按网速降序」。
    veteran_days: 3           # 存活天数门槛（首次测通至今）
    # 网速门槛原来写 1024（1MB/s），实测这个值是空转的：2026-10-28 全网最快只有
    # 748KB/s（中位 226、p90 570），且唯一活过 24 小时的节点只有 172~748KB/s。
    # 「又快又老」在免费节点池里几乎不存在——快节点被大量共用，寿命反而最短；
    # 能活过三天的都是慢而稳的那类（名字就叫老黄牛，本来也不该要求 1MB/s）。
    # 改成 256 后，门槛落在当前生态的 p50~p75 之间：既不奖励老僵尸（<100 已被下限
    # 筛掉），又能让真正稳定的节点前置。攒到足够长的存活数据后可再上调。
    veteran_kbps: 256

  # --- C 档：本机（国内家宽）真实代理测速白名单 ---
  # 上面两轮筛选都不在国内：mihomo 测速跑在 GitHub Actions（美国机房），Globalping 只发
  # 一次 TLS 握手。GFW 常「放握手、掐流量」，于是通过全部筛选的节点实测只有约一半真能用
  # （169 个里 78 个）。这里把「国内能不能真代理出网」交给用户自己的国内机器：
  # local_probe.py 拉取 candidates.json，用 mihomo 内核逐节点真实 CONNECT + 下载测速，
  # 产出 whitelist.json 推回仓库；CI 按白名单过滤，并按「延迟 + 网速」综合分排序。
  # 白名单过期/缺失/命中过少时自动回退 Globalping 探测，不会写坏订阅。
  candidates:
    enabled: true
    file: "candidates.json.gz"  # 相对仓库根目录
    max: 1300                # 候选池上限。本机给每个节点开一个入站端口，
                             # 太多会让测速变慢、也吃内存。分批 + 补测之后单轮成本
                             # 大约是「节点数 / 并发 × 单节点耗时」。
                             # 2026-10-27 实测（同一份白名单，唯一变量是这个值）：
                             #   600  → 可出网 146/600，发布 16 个，单轮 8 分 07 秒
                             #   1000 → 可出网 172/1000，发布 31 个，单轮 15 分 30 秒
                             # 发布量接近翻倍，代价是探测多花 7 分钟。计划任务 3 小时一轮，
                             # 完全放得下。
                             # 2026-10-28 提到 1300：白名单已涨到 826 条，1000 个名额装不下
                             # 「发布集 + 已验证老节点」，只能挤掉新节点。单轮预估 20 分钟，
                             # 3 小时周期仍有余量。
    # 已验证老节点的名额比例：白名单里测通过、但本轮没进发布集的节点，下一轮必须
    # 优先占位重测。不保它们会形成死锁——没进池就不会被重测 → round 停在旧值 →
    # CI 判 stale 下线 → 下一轮更没理由保它，存活时长永远攒不起来（2026-10-28
    # 实测：826 条白名单只有 288 个进池，发布集最老节点仅 49.6 小时、老黄牛恒为 0）。
    # 0.6 表示 60% 的空余名额给它们，剩下 40% 留给新节点（否则候选池只会剩老面孔，
    # 老节点死光后就没有新血补位）。设 0 则退化为「老节点全保」，不做新老分层。
    verified_ratio: 0.6
    # 
  whitelist:
    enabled: true
    file: "whitelist.json"
    # 原来写 2 小时。可 local_probe 是**手动**跑的，实测最近一次是 68 小时前 ——
    # 2 小时的窗口意味着 97% 的构建都判定「过期」，排序退回到机房测的网速。
    # 而机房网速与本机实测的相关系数只有 +0.107（等于瞎选），用户的真实体感全由
    # 这份退回后的排序决定。放宽到 4 小时，让「上班顺手跑一次」能覆盖大半天；
    # 要让白名单长期有效，正解是用计划任务每 2 小时跑一次 local_probe --push。
    max_age_hours: 4         # 超过该时长视为过期，自动回退 Globalping 探测。
                             # 免费节点寿命以分钟计，白名单越新越准；真正决定新鲜度的是
                             # local_probe 每次推送都会触发一次构建（白名单模式下约 4 分钟）
    min_match: 10            # 命中少于该数说明白名单与候选池脱节，回退 Globalping
    min_ok_rounds: 1         # 至少被本机测通过几次才算可用（2=要求跨轮稳定）
    require_latest_round: true  # 只发「本轮本机实测通过」的节点。ok_rounds 是累计值，
                             # 上一轮测通、这一轮已死的节点照样 ≥1；光靠时间窗不够——
                             # 实测混入 208 个历史命中后，发布集可用率从 92% 掉到 59%。
    ok_within_hours: 4       # 额外的时间兜底：last_ok 超过该时长的条目不发。
                             # 必须 >= max_age_hours，否则「白名单有效期」被这一条先掐死
                             # （原来 0.5h：probe 跑完半小时后所有条目都超时，等于白名单从没生效过）
    min_keep: 3              # 网速下限的兜底红线：达标节点少于该数时判定「测速环节
                             # 本身失效」（端点挂了/内核测不动），本轮放弃网速过滤，
                             # 否则会发出空订阅。设 0 关闭兜底。
                             # 别调大：免费节点里能真正搬运大流量的本来就少（实测一轮
                             # 250 个「能出网」里只有 48 个测出速度），调到 20 会让
                             # 「按 100KB/s 过滤」在大部分轮次直接失效。
    # 网速下限已统一到 `check.min_speed_kbps`（见下文第二轮测速段），这里别再写
    # 第二个数字：两处各说各话会让发布集随「白名单是否新鲜」跳变。
    # 本机探测的轮间隔（小时），只用于给「存活时长功能上线前的老条目」倒推起点：
    # 老条目只有累计测通轮数 ok_rounds，没有 first_ok。倒推值在订阅名字里带 `~`。
    # 取值应与计划任务周期一致（当前每 3 小时）。
    round_interval_hours: 3
  # 第二轮：真实下载测速（剔除下载失败或网速过低的）
  # 端点按顺序预跑、取「直连下得最多」的那个（prober._pick_speed_url）。
  # 2026-10-25 本机直连实测：dl.google.com 24 700 KB/s；speed.cloudflare.com 308~446 KB/s。
  # 注意这个差距只发生在**直连那一段**——经代理访问时两端都在境外，差距远没有这么夸张，
  # 所以换端点不是提速的关键，它保证的是「预跑与机房侧测量不被端点本身卡住」。
  # 端点必须满足「明文 HTTP + 大文件 + 不跳转」，否则 TLS-in-TLS 与 302 会被算进速率。
  speed_urls:
    - "http://dl.google.com/dl/android/studio/install/2023.1.1.28/android-studio-2023.1.1.28-windows.exe"
    - "https://speed.cloudflare.com/__down?bytes=50000000"
  speed_bytes: 3000000       # 下载够这么多字节就够算速度（不足 1 秒稳态窗口时会继续下）
  speed_timeout_ms: 8000     # 单节点测速预算（毫秒）
  # 并发下载数。旧值 4 是照着「本机总出口只有 300~600KB/s」定的，而这个数字
  # 2026-10-25 复测证伪：本机直连 dl.google.com 稳定 24~25MB/s，Cloudflare 那 300KB/s
  # 是**端点**的瓶颈，不是线路的。端点换成大文件后 8 并发每路仍有 3MB/s 余量，
  # 不会互相挤压，而并发翻倍直接把 600 个候选的单轮耗时砍半。
  speed_concurrency: 8
  min_speed_kbps: 100        # 网速下限（KB/s）：名字里达不到这个速度的节点直接不发。
                             # 白名单模式与境外测速模式共用这一个口径。
                             # **测不出网速（订阅里显示 `--`）的同样剔除**：2026-10-27
                             # 对 13 个零速节点逐个归因，77% 是「能过 204 探测、一下载
                             # 大文件就被上游掐断」（mihomo 入站回 502/404），剩下是当场
                             # 掉线或只有 46~102KB/s——它们不是「没测到」，是「下不动」。
  # --- 第三轮：中国大陆可达性（借助 Globalping 公开 API）---
  # TLS 层验证：从国内真实家宽探测点（eyeball-network）对节点发 HTTPS 请求，
  # SNI/Host/路径取节点真实配置（CF 边缘对裸 TCP 永远应答，只测端口会把死节点判活）；
  # reality/明文节点退回 TCP 拨号；hysteria2 等 UDP 协议退回 ICMP（尽力而为）。
  # 额度：Globalping 免费 250 tests/小时（1 个探测点=1 test）；设置环境变量
  # GLOBALPING_TOKEN（用 GitHub 账号免费注册 globalping.io）可提升到 500。
  # 第 1 轮每单位 1 个探测点（按网速从快到慢），剩余额度优先补测无结论/待复核单位，
  # 每单位最多 max_probes 点、≥2 票定案；额度不足时单票定案，未测到的按未知剔除。
  # 周期性用百度做对照组，探测网络自身异常时自动退避；429 按 Retry-After 重试，
  # 未知单位冷却后补测一轮。
  # strict（激进）：国内验证通过才保留；不通或未知一律剔除，节点更少但更干净。
  # safe（保守）：只剔除「国内不通但境外能通」的确认被墙节点，其余一律保留。
  # 安全阀：若国内探测几乎全部未知（限速/接口异常），自动跳过该过滤，不写空订阅。
  china_check:
    enabled: true
    mode: "strict"           # strict=激进（推荐）；safe=保守
    country: "CN"            # 探测点所在国家（中国大陆）
    reference_country: "US"  # 仅 safe 模式使用的复核探测点所在国家
    tag: "eyeball-network"   # 只要真实家宽探测点（机房出口与家宽体验不一致）
    max_units: 240           # 进入国内探测的节点数上限（0=不限）。免费额度约 250 tests/h，
                             # 超出预算的单位只能记「未知」并在 strict 下被剔除，于是留下谁
                             # 就变成了「先测谁」而不是「谁更好」。这里按
                             # 「连续存活次数 → 网速」截断，让额度花在最值得的候选上。
    max_probes: 3            # 每单位最多用几个探测点
    nodes_per_unit: 10       # 同一探测单位最多覆盖几个节点（折叠上限）。
                             # TLS 单位按 SNI 折叠、不按 server 拆：240 个候选摊成 180 个单位时，
                             # 免费额度只够每单位 1.3 个探测点，单点噪声直接决定生死
                             # （实测发布 186 个、真实可用仅 63 个）。折叠后单位数十几个，
                             # 每单位 3~5 点做多数表决；再用本参数封顶，避免单次探测影响过多节点。（第 1 轮每点 1 个，剩余额度逐轮补）
    hourly_tests: 250        # 每小时 tests 额度（无 token=250；配 GLOBALPING_TOKEN 可设 500）
    reserve_tests: 24        # 给对照组/境外复核/冷却补测预留的 tests 数
    concurrency: 4           # 并发测量数（国内家宽探测点很少，太高会把 probe 压垮导致成片误判）
    submit_gap: 0.35         # 提交测量的最小间隔（秒），削峰避免触发拥塞/限速
    control_every: 25        # 每多少个单位插一次百度对照组；0=关闭
    poll_interval: 2.0       # 轮询结果间隔（秒）
    timeout_s: 90            # 单次测量的总超时（秒）
  # --- method: tcp（仅连通性，精度低）---
  tcp_timeout: 3.0           # 单个节点 TCP 连接超时（秒）
  tcp_concurrency: 200       # 并发数

output:
  dir: "docs"                # 产物目录（GitHub Pages 直接发布该目录）
  clash_file: "sub/clash.yaml"
  v2ray_file: "sub/v2ray.txt"
  status_file: "status.json"

# 存活账本：记录每个节点「连续通过了几次构建」，用来优待真正长寿的节点。
# 免费节点寿命以分钟计，单次构建筛出的「当下最快」往往几分钟后就死；
# 能跨多轮构建存活的少数才是真金。账本随 CI 一起提交，状态持久化。
history:
  enabled: true
  file: "history.json"       # 相对仓库根目录
  trusted_streak: 3          # 连续通过几次构建算「可信」：置顶排序 + 探测额度不足时无条件保留

clash:
  http_port: 7890
  socks_port: 7891
  external_controller: "127.0.0.1:9090"
  test_url: "http://www.gstatic.com/generate_204"
  test_interval: 600
  test_timeout: 8000        # 自动选择组单次测速超时（毫秒），晚高峰国际链路慢，默认 5000 容易误判 timeout
  # 负载均衡组：成员取发布顺序最前（即实测最快）的 N 个节点。
  # 别指望它是银弹：2026-10-25 本机实测，12 条连接分散到 12 个中等节点合计 4 732KB/s，
  # 全压在 1 个节点 3 882KB/s —— 只有 1.2 倍。免费代理的瓶颈是**单条连接**的吞吐，
  # 不是节点总带宽。它的实际价值是「某个节点中途挂了不至于整条路断掉」。
  # 0 = 不生成该组；成员少于 3 个也不生成。
  balance_nodes: 24
  # 地区分组的最少节点数：地区识别从 16 个国家扩到 100+ 之后，「一国一两个节点」的地区
  # 会把分组列表刷成几十个几乎空的小组，反而更难选。少于该数的地区并入「🌐 其他」。
  min_region_nodes: 8

# 节点命名：地区 | 网速 | 已存活 | 原名里的代表性标志
# 上游名字是各家自己拼的，同一个订阅里能同时出现 🇸🇬SG_131|578KB/s、
# RO - zhuhai.uk 05 [be5ac291e62c920d]、vless-1879607313、【机场推荐：…】 等写法，
# 用户看不出哪个快、哪个在哪。统一改名后名字本身就是一句话：
#   🇸🇬新加坡|578KB/s|36h|131
#   🇷🇴罗马尼亚|1.5MB/s|5d|zhuhai.uk 05
# 地区取自国旗/国家码/中文名（见 builder.REGION_TABLE），网速取自**实测**
# （白名单的 _wl_kbps 或本轮 mihomo 探测的 _speed_kbps），未测出的显示 --。
# 存活 = 首次测通至今（7d / 36h，推算值带 ~），排序里的「老黄牛」就是按它判断的。
# 代表性标志 = 原名剥掉地区/网速/延迟字样/推广位后剩下的部分，用来区分同地区同网速的线路。
naming:
  enabled: true
  marker_max: 20            # 标志部分最多保留多少个字符（超出截断，避免名字过长被客户端截）
  # 名字里带上「已存活多久」。关掉后名字回到「地区 | 网速 | 标志」三段。
  # 这一段的代价是 3~5 个字符（`7d` / `36h`），换来的信息量远高于多留几个标志字符：
  # 没有它，用户无法区分「8MB/s 刚上线」和「1.5MB/s 已稳五天」。
  age_in_name: true
  # true：机房（CI，美国）测出来的网速在名字里加 `~` 前缀，表示「参考值，非本机实测」。
  # 依据：2026-10-25 对线上 240 个节点全量实测，标注网速与从本机实测的 Spearman
  # 相关系数仅 +0.107；标称 7.2MB/s 的节点实测 31KB/s，标称 6.9MB/s 的有实测排第 195 名。
  # 白名单（local_probe 本机实测）给出的数不加前缀——那是能在你这条线上兑现的。
  mark_untrusted: true

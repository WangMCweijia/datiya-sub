name: Attribution probe
on: workflow_dispatch
jobs:
  attr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Install mihomo
        run: |
          curl -fsSL -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1.19.31.gz
          gunzip -f /tmp/mihomo.gz && chmod +x /tmp/mihomo
          sudo mv /tmp/mihomo /usr/local/bin/mihomo && mihomo -v
      - name: Attribute per-source funnel
        run: python attribute.py 2>&1 | tee attr.log
      - uses: actions/upload-artifact@v4
        with:
          name: attr-log
          path: attr.log
          if-no-files-found: error

name: Update subscription

on:
  schedule:
    # 免费节点寿命以分钟到小时计，每天 3 次太慢（发布时活着、用户导入时已死）。
    # 改为每 2 小时（UTC 偶数小时 17 分）：单次构建约 30~40 分钟，concurrency 已串行化。
    # 之所以不设每小时：Globalping 免费额度 250 tests/h，而单次构建就花掉约 226 tests，
    # 间隔 1 小时会紧贴限额、容易触发 429 引发成片误判。配了 GLOBALPING_TOKEN
    # （额度 500/h）后可以自行改成 "17 * * * *"。
    - cron: "17 */2 * * *"
  workflow_dispatch:
  # 代码/配置有改动时自动刷新订阅；docs/ 和 Trae 分享包是自动产物，忽略以免无谓触发
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/workflows/audit2.yml"
      - "audit2.go"
      - "runner_audit.py"
      - ".github/workflows/audit3.yml"
      - "audit3.go"
      - "runner_audit3.py"
      - ".trae-html-share-packages/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install mihomo
        run: |
          curl -fsSL -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1.19.31.gz
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          sudo mv /tmp/mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Build subscription
        env:
          # 可选：在 globalping.io 用 GitHub 账号免费注册后把 token 配到仓库 Secrets，
          # 国内可达性探测额度可从 250 tests/h 提升到 500 tests/h；不配置也能正常运行。
          GLOBALPING_TOKEN: ${{ secrets.GLOBALPING_TOKEN }}
        run: python main.py --verbose

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs
          # history.json 是跨构建存活账本，必须一起提交，否则每轮都从零开始。
          # 首次运行时文件可能还不存在，用条件判断避免 git add 报错中断构建。
          [ -f history.json ] && git add -f history.json
          git diff --cached --quiet || git commit -m "chore: 更新订阅 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
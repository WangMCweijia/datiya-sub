name: Update subscription

on:
  schedule:
    # UTC：站点每天 22:44 (UTC) 左右更新，多跑几次兜底。北京时间 08:17 / 16:17 / 00:17
    - cron: "17 0,8,16 * * *"
  workflow_dispatch:
  # 代码/配置有改动时自动刷新订阅；docs/ 是 workflow 自己提交的产物，忽略以免递归
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install mihomo
        run: |
          curl -fsSL -o /tmp/mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.31/mihomo-linux-amd64-v1.19.31.gz
          gunzip -f /tmp/mihomo.gz
          chmod +x /tmp/mihomo
          sudo mv /tmp/mihomo /usr/local/bin/mihomo
          mihomo -v

      - name: Build subscription
        run: python main.py --verbose

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs
          git diff --cached --quiet || git commit -m "chore: 更新订阅 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4